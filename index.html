<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basit Not Defteri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>📝 Basit Not Defteri</h1>
      <p>Hızlı ve kolay not alma uygulaması</p>
    </header>

    <section class="form-card">
      <h2 id="formTitle">Yeni Not Ekle</h2>
      
      <form id="noteForm">
        <input type="hidden" id="noteId">

        <div class="form-group">
          <label for="title">Not Başlığı:</label>
          <input type="text" id="title" placeholder="Örn: Alışveriş Listesi" required>
        </div>

        <div class="form-group">
          <label for="content">Not İçeriği:</label>
          <textarea id="content" rows="4" placeholder="Notunuzu buraya yazın..." required></textarea>
        </div>

        <div class="button-group">
          <button type="submit" id="submitBtn" class="btn btn-primary">Notu Kaydet</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Vazgeç</button>
        </div>
      </form>
    </section>

    <section class="notes-section">
      <h2>Notlarım (<span id="noteCount">0</span>)</h2>
      <div id="notesList" class="notes-grid"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
